<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philadelphia Council Districts Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
    <!-- Sidebar -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h2>Dashboard</h2>
            <button class="toggle-btn" id="toggle-sidebar">
                <i class="fas fa-chevron-left"></i>
            </button>
        </div>

        <!-- Import Data Section at the top -->
        <div class="import-section top-import">
            <input type="file" id="file-input" accept=".xlsx, .xls">
            <button class="import-btn" id="import-data">
                <i class="fas fa-file-import"></i>
                <span>Import Data</span>
            </button>
            <p class="import-note">
                Upload Excel file with required sheets
            </p>
        </div>

        <div class="menu-items">
            <div class="menu-item active" data-section="analytical">
                <div class="menu-item-content">
                    <i class="fas fa-chart-line"></i>
                    <span>Analytical Indicators</span>
                </div>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-analytical" class="toggle-input" checked>
                    <label for="toggle-analytical" class="toggle-label"></label>
                </div>
            </div>
            <div class="menu-item" data-section="capital">
                <div class="menu-item-content">
                    <i class="fas fa-building"></i>
                    <span>Capital Investments</span>
                </div>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-capital" class="toggle-input" checked>
                    <label for="toggle-capital" class="toggle-label"></label>
                </div>
            </div>
            <div class="menu-item" data-section="demographics">
                <div class="menu-item-content">
                    <i class="fas fa-users"></i>
                    <span>District Demographics</span>
                </div>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-demographics" class="toggle-input" checked>
                    <label for="toggle-demographics" class="toggle-label"></label>
                </div>
            </div>
            <div class="menu-item" data-section="economic">
                <div class="menu-item-content">
                    <i class="fas fa-chart-pie"></i>
                    <span>Economic Context</span>
                </div>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-economic" class="toggle-input" checked>
                    <label for="toggle-economic" class="toggle-label"></label>
                </div>
            </div>
            <div class="menu-item" data-section="amenities">
                <div class="menu-item-content">
                    <i class="fas fa-parking"></i>
                    <span>Public Amenities</span>
                </div>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-amenities" class="toggle-input" checked>
                    <label for="toggle-amenities" class="toggle-label"></label>
                </div>
            </div>
            <div class="menu-item" data-section="facilities">
                <div class="menu-item-content">
                    <i class="fas fa-school"></i>
                    <span>School Facilities</span>
                </div>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-facilities" class="toggle-input" checked>
                    <label for="toggle-facilities" class="toggle-label"></label>
                </div>
            </div>
            <div class="menu-item" data-section="status">
                <div class="menu-item-content">
                    <i class="fas fa-clipboard-check"></i>
                    <span>School Status</span>
                </div>
                <div class="toggle-switch">
                    <input type="checkbox" id="toggle-status" class="toggle-input" checked>
                    <label for="toggle-status" class="toggle-label"></label>
                </div>
            </div>
        </div>

        <!-- Insights Button Section -->
        <div class="insights-section">
            <button class="insights-btn" id="insights-button">
                <i class="fas fa-chart-bar"></i>
                <span>Insights</span>
                <i class="fas fa-external-link-alt"></i>
            </button>
            <p class="insights-note">
                Generate visual insights from imported data
            </p>
        </div>

        <div class="basemap-section">
            <h3><i class="fas fa-layer-group"></i> Base Map Style</h3>
            <div class="basemap-selector">
                <!-- Radio button style basemap options -->
                <div class="basemap-radio-group">
                    <label class="basemap-radio-option active" data-basemap="light">
                        <input type="radio" name="basemap" value="light" checked>
                        <div class="radio-content">
                            <div class="radio-icon">
                                <i class="fas fa-sun"></i>
                            </div>
                            <div class="radio-text">
                                <span class="radio-title">Light</span>
                                <span class="radio-subtitle">OpenStreetMap</span>
                            </div>
                            <div class="radio-check">
                                <i class="fas fa-check"></i>
                            </div>
                        </div>
                    </label>
                    
                    <label class="basemap-radio-option" data-basemap="dark">
                        <input type="radio" name="basemap" value="dark">
                        <div class="radio-content">
                            <div class="radio-icon">
                                <i class="fas fa-moon"></i>
                            </div>
                            <div class="radio-text">
                                <span class="radio-title">Dark</span>
                                <span class="radio-subtitle">Dark Theme</span>
                            </div>
                            <div class="radio-check">
                                <i class="fas fa-check"></i>
                            </div>
                        </div>
                    </label>
                    
                    <label class="basemap-radio-option" data-basemap="satellite">
                        <input type="radio" name="basemap" value="satellite">
                        <div class="radio-content">
                            <div class="radio-icon">
                                <i class="fas fa-satellite"></i>
                            </div>
                            <div class="radio-text">
                                <span class="radio-title">Satellite</span>
                                <span class="radio-subtitle">Aerial View</span>
                            </div>
                            <div class="radio-check">
                                <i class="fas fa-check"></i>
                            </div>
                        </div>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map-container">
        <div id="map"></div>
        
        <!-- Status Message -->
        <div id="status-message" style="display: none;"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
